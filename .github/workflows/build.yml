name: Build Pinscape Pico Firmware 7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio y submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 git libusb-1.0-0-dev

      - name: Configurar Pico SDK
        run: |
          git clone --depth 1 --branch 2.0.0 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          cd /opt/pico-sdk
          git submodule update --init

      - name: Compilar pioasm nativo del SDK
        run: |
          mkdir -p /opt/pico-sdk/tools/pioasm/build
          cd /opt/pico-sdk/tools/pioasm/build
          cmake ..
          make -j$(nproc)

      - name: Compilar y empaquetar firmware de la Pico
        env:
          PICO_SDK_PATH: /opt/pico-sdk
        run: |
          FW_DIR=""
          for d in $(find . -name "CMakeLists.txt" | grep -v "ButtonLatencyTester" | grep -v "CmdLineConfigTool"); do
            if grep -q "pico_sdk_init" "$d"; then
              FW_DIR=$(dirname "$d")
              break
            fi
          done

          if [ -z "$FW_DIR" ]; then
            FW_DIR="."
          fi

          echo "Directorio real del firmware de la Pico seleccionado: $FW_DIR"
          cd "$FW_DIR"
          
          mkdir -p build
          cd build
          cmake -DPICO_SDK_PATH=/opt/pico-sdk -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          make -j$(nproc)
          
          # Copiar el archivo .uf2 resultante a la carpeta de salida
          cd ${{ github.workspace }}
          mkdir -p firmware_output
          echo "Buscando archivos .uf2 generados..."
          find . -name "*.uf2" -type f -exec cp -v {} firmware_output/ \;
          
          echo "Contenido final de firmware_output:"
          ls -la firmware_output/

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PinscapePico-Firmware
          path: firmware_output/
