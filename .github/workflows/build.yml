name: Build Pinscape Pico Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio y submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 git

      - name: Configurar Pico SDK
        run: |
          git clone --depth 1 --branch 2.0.0 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          cd /opt/pico-sdk
          git submodule update --init

      - name: Compilar Firmware de la Pico
        env:
          PICO_SDK_PATH: /opt/pico-sdk
        run: |
          # Compilamos directamente desde la raíz del repositorio donde está el firmware principal
          mkdir build
          cd build
          cmake -DPICO_SDK_PATH=/opt/pico-sdk ..
          make -j$(nproc)

      - name: Guardar archivo .uf2
        uses: actions/upload-artifact@v4
        with:
          name: PinscapePico-Firmware
          path: build/**/*.uf2
