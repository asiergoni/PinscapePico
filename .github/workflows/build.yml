name: Build Pinscape Pico Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio y submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 git libusb-1.0-0-dev

      - name: Configurar Pico SDK
        run: |
          git clone --depth 1 --branch 2.0.0 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          cd /opt/pico-sdk
          git submodule update --init

      - name: Compilar proyecto
        env:
          PICO_SDK_PATH: /opt/pico-sdk
        run: |
          PROJECT_DIR=$(dirname $(find . -name "CMakeLists.txt" | head -n 1))
          echo "Directorio del proyecto: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          mkdir build
          cd build
          cmake -DPICO_SDK_PATH=/opt/pico-sdk ..
          make -j$(nproc)

      - name: Guardar archivo .uf2
        uses: actions/upload-artifact@v4
        with:
          name: PinscapePico-Firmware
          path: '**/build/**/*.uf2'
