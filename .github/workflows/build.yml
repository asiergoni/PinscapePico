name: Build firmware 10.3
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi \
            libnewlib-arm-none-eabi build-essential \
            libstdc++-arm-none-eabi-newlib

      - name: Descargar Pico SDK
        run: |
          git clone --recurse-submodules https://github.com/mjrgh/pico-sdk-2.1.0.git $HOME/pico-sdk
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> $GITHUB_ENV

      - name: Compilar pioasm
        run: |
          ls $PICO_SDK_PATH
          git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/pico-sdk.git $RUNNER_TEMP/pico-sdk-official
          cmake -S $RUNNER_TEMP/pico-sdk-official/tools/pioasm -B $RUNNER_TEMP/pioasm-build
          cmake --build $RUNNER_TEMP/pioasm-build -j4
          mkdir -p $PICO_SDK_PATH/tools/pioasm
          cp $RUNNER_TEMP/pioasm-build/pioasm $PICO_SDK_PATH/tools/pioasm/pioasm
          ls -l $PICO_SDK_PATH/tools/pioasm/pioasm

      - name: Compilar firmware
        working-directory: Firmware
        run: |
          cmake .
          make -j4

      - uses: actions/upload-artifact@v4
        with:
          name: PinscapePico-uf2
          path: Firmware/*.uf2
