name: Build firmware v10.1
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi \
            libnewlib-arm-none-eabi build-essential \
            libstdc++-arm-none-eabi-newlib

      - name: Descargar Pico SDK
        run: git clone --recurse-submodules https://github.com/mjrgh/pico-sdk-2.1.0.git $HOME/pico-sdk

      - name: Compilar
        working-directory: Firmware
        run: |
          cmake . -DPICO_SDK_PATH=$HOME/pico-sdk
          make -j4

      - uses: actions/upload-artifact@v4
        with:
          name: PinscapePico-uf2
          path: firmware/*.uf2
